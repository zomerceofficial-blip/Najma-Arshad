    <script>
      (function () {
        try {
          var t = localStorage.getItem('truvornex-theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F3F4F6] dark:bg-[#07080A] text-[#111215] dark:text-[#F3F4F6] antialiased">
